name: Backup do Banco de Dados

on:
  schedule:
    - cron: '0 3 * * *'   # todo dia às 03:00 UTC (meia-noite no horário de Brasília)
  workflow_dispatch:        # permite rodar manualmente

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Criar branch backup se não existir
        run: |
          git fetch origin backup 2>/dev/null && git checkout backup || git checkout -b backup

      - name: Aguardar sistema estar ativo
        run: |
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://banco-de-horas-cuidadores.onrender.com/api/health)
            if [ "$STATUS" = "200" ]; then echo "Sistema ativo!"; break; fi
            echo "Tentativa $i: status $STATUS. Aguardando 30s..."
            sleep 30
          done

      - name: Fazer backup via API
        run: |
          mkdir -p backups
          FILENAME="backups/backup_$(date +'%Y-%m-%d_%H-%M').json"
          curl -sf --max-time 60 \
            https://banco-de-horas-cuidadores.onrender.com/api/export \
            -o "$FILENAME"
          echo "Backup salvo: $FILENAME"
          python3 -c "
          import json, sys
          data = json.load(open('$FILENAME'))
          total_registros = sum(len(f.get('registros', [])) for f in data)
          print(f'Funcionários: {len(data)} | Registros: {total_registros}')
          "

      - name: Manter só os últimos 30 backups
        run: |
          cd backups
          ls -t *.json 2>/dev/null | tail -n +31 | xargs -r rm --
          cd ..

      - name: Commit e push do backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          git diff --cached --quiet || git commit -m "Backup automático $(date +'%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:backup
