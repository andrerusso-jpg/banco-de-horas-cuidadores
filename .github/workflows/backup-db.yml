name: Backup do Banco de Dados

on:
  schedule:
    - cron: '0 3 * * *'   # todo dia às 03:00 UTC (meia-noite no horário de Brasília)
  workflow_dispatch:        # permite rodar manualmente

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Criar branch backup se não existir
        run: |
          git fetch origin backup 2>/dev/null && git checkout backup || git checkout -b backup

      - name: Instalar PostgreSQL 16 client
        run: |
          sudo apt-get install -y curl gnupg lsb-release
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-16

      - name: Fazer dump do banco
        env:
          PGSSLMODE: require
          PGSSLROOTCERT: /etc/ssl/certs/ca-certificates.crt
        run: |
          mkdir -p backups
          FILENAME="backups/backup_$(date +'%Y-%m-%d_%H-%M').sql"
          pg_dump "postgresql://${{ secrets.PGUSER }}:${{ secrets.PGPASSWORD }}@${{ secrets.PGHOST }}:${{ secrets.PGPORT }}/${{ secrets.PGDATABASE }}?sslmode=require" \
            --no-owner --no-acl \
            -f "$FILENAME"
          echo "Backup salvo: $FILENAME"
          wc -l "$FILENAME"
          ls -lh backups/

      - name: Manter só os últimos 30 backups
        run: |
          cd backups
          ls -t *.sql | tail -n +31 | xargs -r rm --
          cd ..

      - name: Commit e push do backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          git diff --cached --quiet || git commit -m "Backup automático $(date +'%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:backup
