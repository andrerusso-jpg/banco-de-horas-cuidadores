name: Backup do Banco de Dados

on:
  schedule:
    - cron: '0 3 * * *'   # todo dia às 03:00 UTC (meia-noite no horário de Brasília)
  workflow_dispatch:        # permite rodar manualmente

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          ref: backup
          fetch-depth: 0
        continue-on-error: true

      - name: Checkout main se branch backup não existir
        run: |
          git fetch origin backup 2>/dev/null || git checkout -b backup

      - name: Instalar PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Fazer dump do banco
        env:
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGSSLMODE: require
        run: |
          mkdir -p backups
          FILENAME="backups/backup_$(date +'%Y-%m-%d_%H-%M').sql"
          pg_dump \
            -h ${{ secrets.PGHOST }} \
            -p ${{ secrets.PGPORT }} \
            -U ${{ secrets.PGUSER }} \
            -d ${{ secrets.PGDATABASE }} \
            --no-owner --no-acl \
            -f "$FILENAME"
          echo "Backup salvo: $FILENAME"
          ls -lh backups/

      - name: Manter só os últimos 30 backups
        run: |
          cd backups
          ls -t *.sql | tail -n +31 | xargs -r rm --
          cd ..

      - name: Commit e push do backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          git diff --cached --quiet || git commit -m "Backup automático $(date +'%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:backup
