name: Keep Alive

on:
  schedule:
    - cron: '*/10 * * * *'  # a cada 10 minutos
  workflow_dispatch:         # permite rodar manualmente também

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping site
        run: |
          curl -s -o /dev/null -w "Status: %{http_code}\n" \
            https://banco-de-horas-cuidadores.onrender.com/api/health
