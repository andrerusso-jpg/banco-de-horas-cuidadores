# Exemplo de configuração nginx para seu domínio
# Coloque este arquivo em /etc/nginx/sites-available/banco-horas
# e ative com: sudo ln -s /etc/nginx/sites-available/banco-horas /etc/nginx/sites-enabled/
# SSL com certbot: sudo certbot --nginx -d seudominio.com.br

server {
    listen 80;
    server_name seudominio.com.br;

    # Redireciona HTTP → HTTPS (descomente após configurar SSL)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass         http://localhost:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

