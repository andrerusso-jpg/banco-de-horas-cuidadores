# Railway injeta PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD automaticamente.
# Os valores após ':' são os padrões locais (docker-compose).
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:bancodehoras}
spring.datasource.username=${PGUSER:bh_user}
spring.datasource.password=${PGPASSWORD:bh_pass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000

spring.main.lazy-initialization=true

server.port=${PORT:8080}
